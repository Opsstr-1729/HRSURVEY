<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kerala HR Survey 2026 — Project Management Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:     #0b1a22;
      --ink2:    #2e5464;
      --ink3:    #6a9aac;
      --ink4:    #aecdd9;
      --bg:      #f2f7fa;
      --surface: #ffffff;
      --s2:      #eaf2f7;
      --s3:      #ddedf5;
      --accent:  #0b7ea6;
      --accent2: #095f7d;
      --a-pale:  #dff0f9;
      --a-mid:   #4db8de;
      --green:   #0c8f6f;
      --g-pale:  #dff5ef;
      --g-mid:   #4ecfad;
      --border:  #cce0ea;
      --border2: #b0cfdc;
      --r:       14px;
      --r2:      9px;
      --r3:      22px;
      --mono:    'JetBrains Mono', monospace;
      --display: 'Syne', sans-serif;
      --body:    'DM Sans', sans-serif;
      --sh:      0 2px 12px rgba(11,126,166,.07);
      --sh2:     0 6px 28px rgba(11,126,166,.11);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header-accent-bar {
      height: 3px;
      background: linear-gradient(90deg, #0e5774 0%, #1a9dc9 40%, #4db8de 55%, #1a9dc9 70%, #0e5774 100%);
    }
    header {
      background: #0e5774;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(14,87,116,.3);
    }
    .header-inner {
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      flex-wrap: wrap;
      min-height: 80px;
    }
    .brand {
      display: flex;
      align-items: stretch;
      flex: 1;
    }
    .brand-logobox {
      display: flex;
      align-items: center;
      padding: .75rem 1.75rem;
      background: #ffffff;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,.15);
    }
    .brand-logobox img {
      height: 54px;
      width: auto;
      max-width: 260px;
      object-fit: contain;
      display: block;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem 2rem;
    }
    .brand-text h1 {
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.01em;
      line-height: 1.2;
    }
    .brand-text p {
      font-family: var(--mono);
      font-size: .63rem;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-top: .3rem;
    }
    .header-stats {
      display: flex;
      align-items: stretch;
      border-left: 1px solid rgba(255,255,255,.1);
    }
    .stat-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem;
      border-right: 1px solid rgba(255,255,255,.08);
      transition: background .2s;
      min-width: 90px;
    }
    .stat-chip:hover { background: rgba(255,255,255,.1); }
    .stat-chip .n {
      font-family: var(--mono);
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .stat-chip .l {
      font-size: .61rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: rgba(255,255,255,.45);
      margin-top: .3rem;
    }

    /* ── MAIN ── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 2.5rem 4rem;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      gap: .75rem;
      margin-bottom: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink4);
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--ink);
      padding: .78rem 1rem .78rem 2.75rem;
      border-radius: var(--r2);
      font-family: var(--body);
      font-size: .875rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      box-shadow: var(--sh);
    }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11,126,166,.12);
    }
    #searchInput::placeholder { color: var(--ink4); }
    .toolbar-right { display: flex; gap: .5rem; }
    .pill-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r2);
      padding: .55rem 1.1rem;
      font-size: .8rem;
      font-family: var(--body);
      color: var(--ink2);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
      box-shadow: var(--sh);
    }
    .pill-btn:hover {
      background: var(--s2);
      border-color: var(--border2);
      color: var(--accent2);
    }

    /* ── SECTION LABEL ── */
    .section-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-label {
      font-family: var(--mono);
      font-size: .67rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--ink3);
    }
    .result-count {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--ink4);
    }

    /* ── CARD LIST ── */
    #cardList { display: flex; flex-direction: column; gap: .625rem; }

    /* ── ACTIVITY CARD ── */
    .activity-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--sh);
      transition: border-color .2s, box-shadow .2s, transform .15s;
    }
    .activity-card:hover {
      border-color: var(--border2);
      box-shadow: var(--sh2);
      transform: translateY(-1px);
    }
    .activity-card.is-open {
      border-color: var(--a-mid);
      box-shadow: 0 4px 24px rgba(11,126,166,.1);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .card-header:hover { background: rgba(11,126,166,.018); }

    .serial-wrap {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--s2);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 600;
      color: var(--ink2);
      transition: background .2s, border-color .2s, color .2s;
    }
    .activity-card.is-open .serial-wrap {
      background: var(--a-pale);
      border-color: var(--a-mid);
      color: var(--accent2);
    }

    .card-meta { flex: 1; min-width: 0; }
    .card-title {
      font-family: var(--display);
      font-size: .95rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-obj {
      font-size: .78rem;
      color: var(--ink3);
      margin-top: .18rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-shrink: 0;
    }
    .count-tag {
      background: var(--s2);
      border: 1.5px solid var(--border);
      border-radius: var(--r3);
      padding: .18rem .65rem;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--ink3);
      transition: background .2s, border-color .2s, color .2s;
    }
    .activity-card.is-open .count-tag {
      background: var(--a-pale);
      border-color: var(--a-mid);
      color: var(--accent2);
    }
    .chevron {
      width: 18px;
      height: 18px;
      color: var(--ink4);
      transition: transform .22s ease, color .2s;
      flex-shrink: 0;
    }
    .activity-card.is-open .chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    /* ── ACCORDION BODY ── */
    .accordion-body { display: none; border-top: 1.5px solid var(--border); }
    .accordion-body.open { display: block; }

    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sub-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .sub-table thead tr { background: var(--s2); }
    .sub-table thead th {
      padding: .65rem 1.1rem;
      text-align: left;
      font-family: var(--mono);
      font-weight: 500;
      font-size: .67rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--ink3);
      border-bottom: 1.5px solid var(--border);
      white-space: nowrap;
    }
    .sub-table tbody tr { transition: background .1s; }
    .sub-table tbody tr:hover { background: #f7fbfd; }
    .sub-table tbody tr:not(:last-child) td { border-bottom: 1px solid #eaf2f7; }
    .sub-table td {
      padding: .8rem 1.1rem;
      vertical-align: top;
      color: var(--ink);
    }
    .sub-table td:not(:last-child) { border-right: 1px solid #eaf2f7; }

    /* ── BADGES ── */
    .badge-id {
      display: inline-flex;
      align-items: center;
      background: var(--s2);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: .2rem .6rem;
      font-family: var(--mono);
      font-size: .7rem;
      font-weight: 500;
      color: var(--ink2);
    }
    .badge-outcome {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      background: var(--g-pale);
      border: 1.5px solid rgba(78,207,173,.3);
      border-radius: var(--r3);
      padding: .22rem .7rem;
      font-size: .74rem;
      font-weight: 500;
      color: var(--green);
      white-space: nowrap;
    }
    .badge-outcome::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .rat-text {
      font-size: .76rem;
      color: var(--ink3);
      line-height: 1.55;
      font-style: italic;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--ink3);
    }
    .empty-state svg {
      width: 40px;
      height: 40px;
      margin: 0 auto 1rem;
      opacity: .25;
    }
    .empty-state p { font-size: .875rem; }

    /* ── LOADING STATE ── */
    .loading-state {
      display: flex;
      flex-direction: column;
      gap: .625rem;
    }
    .skel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      height: 64px;
      overflow: hidden;
      position: relative;
    }
    .skel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(11,126,166,.06) 50%, transparent 100%);
      animation: shimmer 1.4s ease infinite;
      background-size: 200% 100%;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1.5px solid var(--border);
      padding: 1.75rem 2.5rem;
      background: var(--surface);
      margin-top: 3rem;
    }
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .footer-copy { font-size: .73rem; color: var(--ink3); }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-family: var(--mono);
      font-size: .67rem;
      color: var(--green);
      background: var(--g-pale);
      border: 1.5px solid rgba(78,207,173,.3);
      border-radius: var(--r3);
      padding: .25rem .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    .fade-up { animation: fadeUp .28s ease both; }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .header-inner { padding: 1rem 1.25rem; }
      main { padding: 1.5rem 1.25rem 3rem; }
      .card-obj { display: none; }
      .stat-chip { min-width: 60px; padding: .6rem .9rem; }
      footer { padding: 1.25rem; }
    }

    /* ── HIGHLIGHT ── */
    mark.hl {
      background: rgba(77,184,222,.2);
      color: var(--accent2);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-accent-bar"></div>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logobox">
          <img id="mainLogo" alt="KASE · IT Operations and Strategy Division" />
        </div>
        <div class="brand-text">
          <h1>Kerala HR Survey 2026</h1>
          <p>KASE · Project Management Portal</p>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-chip">
          <div class="n" id="statActivities">—</div>
          <div class="l">Domains</div>
        </div>
        <div class="stat-chip">
          <div class="n" id="statSub">—</div>
          <div class="l">Tasks</div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search domains, tasks, outcomes…" autocomplete="off" />
      </div>
      <div class="toolbar-right">
        <button class="pill-btn" id="btnExpandAll">Expand all</button>
        <button class="pill-btn" id="btnCollapseAll">Collapse all</button>
      </div>
    </div>

    <div class="section-meta">
      <span class="section-label">Survey Domains</span>
      <span class="result-count" id="resultCount"></span>
    </div>

    <div id="cardList">
      <!-- Skeleton loading state -->
      <div class="loading-state" id="loadingState">
        <div class="skel"></div>
        <div class="skel"></div>
        <div class="skel"></div>
        <div class="skel"></div>
        <div class="skel"></div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span class="footer-copy">© 2026 Kerala Academy for Skills Excellence (KASE) · Project Management Unit</span>
      <span class="live-badge"><span class="live-dot"></span>Live sync active</span>
    </div>
  </footer>

CIiAIiIAiIgCIiAIiIAiIgP/Z";

    // Google Sheets published CSV URL
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYDoK6XFGUKeyrW6JAtiYoaHDKR2h1gz12cp8w-fZ0jAebK8MK4bJdvRi3AceYej_7oOKp3S2akVW7/pub?output=csv';

    // ── CSV PARSER ─────────────────────────────────────────────────────────────

    function parseCSV(raw) {
      const rows = [];
      let cur = [], field = '', inQ = false;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i], nx = raw[i + 1];
        if (inQ) {
          if (ch === '"' && nx === '"') { field += '"'; i++; }
          else if (ch === '"') { inQ = false; }
          else { field += ch; }
        } else {
          if (ch === '"') { inQ = true; }
          else if (ch === ',') { cur.push(field.trim()); field = ''; }
          else if (ch === '\n') { cur.push(field.trim()); rows.push(cur); cur = []; field = ''; }
          else { field += ch; }
        }
      }
      cur.push(field.trim());
      if (cur.length > 1) rows.push(cur);
      return rows;
    }

    // ── DATA BUILDER ───────────────────────────────────────────────────────────

    function buildActivities(rows) {
      const activities = [];
      let current = null;
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const sl = (row[0] || '').trim();
        if (sl && !isNaN(sl)) {
          current = { id: sl, title: row[1] || '', obj: row[2] || '', subs: [] };
          activities.push(current);
        }
        if (current && (row[3] || row[4])) {
          current.subs.push({ tp: row[3] || '', sub: row[4] || '', out: row[5] || '', rat: row[6] || '' });
        }
      }
      return activities;
    }

    // ── HIGHLIGHT HELPER ───────────────────────────────────────────────────────

    function hl(text, q) {
      if (!q) return escHtml(text);
      const escaped = escHtml(text);
      const escapedQ = escHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return escaped.replace(new RegExp(escapedQ, 'gi'), m => `<mark class="hl">${m}</mark>`);
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── RENDER ─────────────────────────────────────────────────────────────────

    let allData = [];
    let currentQuery = '';

    function render(list, q) {
      const wrap = document.getElementById('cardList');

      // Remove skeleton
      const skel = document.getElementById('loadingState');
      if (skel) skel.remove();

      wrap.innerHTML = '';

      document.getElementById('resultCount').textContent =
        list.length === allData.length
          ? `${list.length} domain${list.length !== 1 ? 's' : ''}`
          : `${list.length} of ${allData.length} domains`;

      if (!list.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
            <p>No results for <strong>"${escHtml(q)}"</strong></p>
          </div>`;
        document.getElementById('statActivities').textContent = 0;
        document.getElementById('statSub').textContent = 0;
        return;
      }

      let totalSub = 0;
      list.forEach((act, idx) => {
        totalSub += act.subs.length;
        const card = document.createElement('div');
        card.className = 'activity-card fade-up';
        card.style.animationDelay = `${Math.min(idx * 35, 350)}ms`;

        const trs = act.subs.map(s => `
          <tr>
            <td><span class="badge-id">${escHtml(s.tp)}</span></td>
            <td style="font-weight:500;">${hl(s.sub, q)}</td>
            <td><span class="badge-outcome">${hl(s.out, q)}</span></td>
            <td><span class="rat-text">${escHtml(s.rat)}</span></td>
          </tr>`).join('');

        card.innerHTML = `
          <div class="card-header" onclick="toggleCard(this)" role="button" aria-expanded="false">
            <div class="serial-wrap">${escHtml(act.id)}</div>
            <div class="card-meta">
              <div class="card-title">${hl(act.title, q)}</div>
              <div class="card-obj">${hl(act.obj, q)}</div>
            </div>
            <div class="card-right">
              <span class="count-tag">${act.subs.length} task${act.subs.length !== 1 ? 's' : ''}</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
          <div class="accordion-body">
            <div class="table-scroll">
              <table class="sub-table">
                <thead>
                  <tr>
                    <th style="width:80px">ID</th>
                    <th style="width:30%">Process / Task</th>
                    <th style="width:25%">Outcome</th>
                    <th>Rationale</th>
                  </tr>
                </thead>
                <tbody>${trs}</tbody>
              </table>
            </div>
          </div>`;

        wrap.appendChild(card);
      });

      document.getElementById('statActivities').textContent = list.length;
      document.getElementById('statSub').textContent = totalSub;
    }

    // ── TOGGLE ─────────────────────────────────────────────────────────────────

    function toggleCard(header) {
      const card = header.closest('.activity-card');
      const body = header.nextElementSibling;
      const willOpen = !body.classList.contains('open');
      body.classList.toggle('open', willOpen);
      card.classList.toggle('is-open', willOpen);
      header.setAttribute('aria-expanded', willOpen);
    }

    // ── EXPAND / COLLAPSE ALL ──────────────────────────────────────────────────

    document.getElementById('btnExpandAll').addEventListener('click', () => {
      document.querySelectorAll('.accordion-body').forEach(b => {
        b.classList.add('open');
        b.closest('.activity-card').classList.add('is-open');
        b.previousElementSibling.setAttribute('aria-expanded', 'true');
      });
    });

    document.getElementById('btnCollapseAll').addEventListener('click', () => {
      document.querySelectorAll('.accordion-body').forEach(b => {
        b.classList.remove('open');
        b.closest('.activity-card').classList.remove('is-open');
        b.previousElementSibling.setAttribute('aria-expanded', 'false');
      });
    });

    // ── SEARCH ─────────────────────────────────────────────────────────────────

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentQuery = e.target.value.trim().toLowerCase();
        const filtered = allData.filter(a =>
          a.title.toLowerCase().includes(currentQuery) ||
          a.obj.toLowerCase().includes(currentQuery) ||
          a.subs.some(s =>
            s.sub.toLowerCase().includes(currentQuery) ||
            s.out.toLowerCase().includes(currentQuery) ||
            s.rat.toLowerCase().includes(currentQuery) ||
            s.tp.toLowerCase().includes(currentQuery)
          )
        );
        render(filtered, currentQuery);
      }, 120);
    });

    // ── INIT ───────────────────────────────────────────────────────────────────

    async function init() {
      // Logo
      const logoImg = document.getElementById('mainLogo');
      logoImg.src = 'data:image/png;base64,' + LOGO_BASE64;

      // Fetch data
      try {
        const resp = await fetch(CSV_URL);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        const rows = parseCSV(text);
        allData = buildActivities(rows);
        render(allData, '');
      } catch (err) {
        console.error('Failed to load data:', err);
        const skel = document.getElementById('loadingState');
        if (skel) {
          skel.innerHTML = `
            <div class="empty-state" style="padding:3rem 2rem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <p>Could not load data. Check your network or CSV URL.</p>
            </div>`;
        }
        document.getElementById('statActivities').textContent = '—';
        document.getElementById('statSub').textContent = '—';
      }
    }

    init();
  </script>
